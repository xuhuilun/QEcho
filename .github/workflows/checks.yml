name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    name: Python 3.12 / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install uv
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check qecho tests
      - run: uv run pytest -q
      - run: node --check qecho/static/app.js
