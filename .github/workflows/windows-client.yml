name: Windows client

on:
  push:
    branches: [main, 'feature/**']
    paths:
      - '.github/workflows/windows-client.yml'
      - 'packaging/windows/**'
      - 'qecho/**'
      - 'pyproject.toml'
      - 'qecho.example.toml'
      - 'uv.lock'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer:
    name: Windows x64 ${{ matrix.check }}
    runs-on: windows-2025
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        check: [preview, signed-upgrade]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - run: python -m pip install uv
      - id: versions
        shell: pwsh
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          $parts = $version.Split('.')
          $upgrade = "$($parts[0]).$($parts[1]).$([int] $parts[2] + 1)"
          "base=$version" >> $env:GITHUB_OUTPUT
          "upgrade=$upgrade" >> $env:GITHUB_OUTPUT
      - name: Build and smoke test unsigned preview
        if: matrix.check == 'preview'
        shell: pwsh
        env:
          QECHO_CI_VERSION: ${{ steps.versions.outputs.base }}
        run: |
          ./packaging/windows/build.ps1
          ./packaging/windows/smoke.ps1 -Version $env:QECHO_CI_VERSION
      - name: Create an isolated CI signing certificate
        if: matrix.check == 'signed-upgrade'
        shell: powershell
        run: |
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject 'CN=QEcho CI Test Only' -CertStoreLocation 'Cert:\CurrentUser\My' -NotAfter (Get-Date).AddDays(1)
          $certFile = Join-Path $env:RUNNER_TEMP 'qecho-test-signer.cer'
          Export-Certificate -Cert $cert -FilePath $certFile | Out-Null
          Import-Certificate -FilePath $certFile -CertStoreLocation 'Cert:\CurrentUser\Root' | Out-Null
          Import-Certificate -FilePath $certFile -CertStoreLocation 'Cert:\CurrentUser\TrustedPublisher' | Out-Null
          "QECHO_TEST_SIGNER_THUMBPRINT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Verify signed in-place upgrade and data persistence
        if: matrix.check == 'signed-upgrade'
        shell: pwsh
        env:
          QECHO_CI_VERSION: ${{ steps.versions.outputs.base }}
          QECHO_CI_UPGRADE_VERSION: ${{ steps.versions.outputs.upgrade }}
        run: |
          ./packaging/windows/build.ps1 -TestSigning -Version $env:QECHO_CI_VERSION
          ./packaging/windows/build.ps1 -TestSigning -Version $env:QECHO_CI_UPGRADE_VERSION
          ./packaging/windows/smoke.ps1 -Version $env:QECHO_CI_VERSION -UpgradeVersion $env:QECHO_CI_UPGRADE_VERSION
      - name: Upload unsigned preview installer
        if: matrix.check == 'preview'
        uses: actions/upload-artifact@v4
        with:
          name: QEcho-Windows-x64-unsigned-preview
          path: dist/windows/preview/*/QEcho-Setup-*-x64.exe
          if-no-files-found: error
          compression-level: 0
